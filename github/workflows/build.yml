name: Build NDS
 
# Runs every time you upload a change, and you can also start it by hand
# from the "Actions" tab.
on:
  push:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
 
    steps:
      - name: Get your files
        uses: actions/checkout@v4
 
      - name: Install DS libraries and example projects
        run: |
          dkp-pacman -Syu --noconfirm nds-dev nds-examples || pacman -Syu --noconfirm nds-dev nds-examples
 
      - name: Put the project together
        run: |
          EX=$(find /opt/devkitpro/examples/nds -maxdepth 3 -type d -name hello_world | head -n 1)
          echo "Using template: $EX"
          mkdir -p build/dsmp3
          cp -r "$EX"/. build/dsmp3/
          rm -rf build/dsmp3/source/*
          cp source/main.c build/dsmp3/source/main.c
          mkdir -p build/dsmp3/include
          curl -fsSL -o build/dsmp3/include/minimp3.h https://raw.githubusercontent.com/lieff/minimp3/master/minimp3.h
          sed -i -E 's/^LIBS[[:space:]]*:=.*/LIBS := -lfat -lmm9 -lnds9/' build/dsmp3/Makefile
          grep -n '^LIBS' build/dsmp3/Makefile
 
      - name: Compile
        run: make -C build/dsmp3
 
      - name: Save the finished .nds
        uses: actions/upload-artifact@v4
        with:
          name: dsmp3-nds
          path: build/dsmp3/*.nds
 
